[project]
name = "relay-agent-lens"
version = "0.1.0"
description = "A NeMo Relay SQL agent on Forge Serverless Inference, traced live into Agent Lens over OTLP, with one injected tool timeout."
requires-python = ">=3.12,<3.13"
dependencies = [
  "nemo-relay==0.11.1",
  "coreweave>=0.1.0b0",
  "wandb[eval-table]>=0.25",
  "httpx>=0.28",
]

[project.scripts]
relay-agent-lens = "relay_agent_lens.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/relay_agent_lens"]
