[project]
name = "evaluator-gate"
version = "0.1.0"
description = "A release gate for prompt changes: NeMo Evaluator scoring, Forge Serverless Inference, and a wandb.EvalTable you can read."
requires-python = ">=3.12,<3.13"
dependencies = [
  "wandb[eval-table]>=0.25",
  "httpx>=0.28",
  "nemo-evaluator",
]

[project.scripts]
evaluator-gate = "evaluator_gate.cli:main"

[tool.uv.sources]
nemo-evaluator = { git = "https://github.com/NVIDIA-NeMo/Evaluator.git", rev = "ea35ba36756abd59de201f60af8a2feba014744d" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evaluator_gate"]
