<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 690" role="img" aria-labelledby="title desc">
  <title id="title">Readable detail from the installed Signal Brief evidence view</title>
  <desc id="desc">A reflowed detail shows the proposal, its claimed novelty, linked evidence, explicit gap assessment, and separate human approval action.</desc>
  <rect width="390" height="690" fill="#171A1F"/>
  <g font-family="Source Sans 3, Arial, sans-serif" fill="#FDFDFD">
    <rect x="18" y="18" width="354" height="54" rx="10" fill="#23262B" stroke="#626872"/>
    <text x="34" y="41" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="700" fill="#FCBC32">CONTENT · EVIDENCE REVIEW</text>
    <text x="34" y="61" font-size="14" fill="#C9CDD3">Inspect before approving</text>

    <rect x="18" y="88" width="354" height="584" rx="12" fill="#232323" stroke="#626872"/>
    <text x="36" y="124" font-size="21" font-weight="700">Predictive RL with W&amp;B Weave</text>
    <text x="36" y="154" font-size="15" fill="#5A96FF">↗ Connected to the selected news story</text>

    <line x1="36" y1="180" x2="354" y2="180" stroke="#4B4E54"/>
    <text x="36" y="216" font-size="18" font-weight="700">What is genuinely new</text>
    <text x="36" y="247" font-size="16">Weave-Models Predictive RL Dashboard</text>
    <text x="36" y="276" font-size="14" fill="#B6BAC1">A concrete artifact and claim to test,</text>
    <text x="36" y="297" font-size="14" fill="#B6BAC1">not a generic content recommendation.</text>

    <text x="36" y="344" font-size="18" font-weight="700">Evidence</text>
    <rect x="36" y="361" width="318" height="78" rx="8" fill="#1B2733"/>
    <text x="52" y="390" font-size="15" font-weight="600" fill="#5A96FF">Understanding Reasoning from</text>
    <text x="52" y="412" font-size="15" font-weight="600" fill="#5A96FF">Pretraining to Post-Training</text>
    <text x="52" y="430" font-size="12" fill="#B6BAC1">Discovered via hf-papers</text>

    <text x="36" y="486" font-size="18" font-weight="700">What is still missing</text>
    <rect x="36" y="503" width="318" height="76" rx="8" fill="#2D3034"/>
    <text x="52" y="533" font-size="15">No blocking evidence gap.</text>
    <text x="52" y="555" font-size="15">Validate claims during production.</text>

    <rect x="36" y="604" width="126" height="44" rx="7" fill="#2F78FF"/>
    <text x="99" y="632" text-anchor="middle" font-size="16" font-weight="600">Approve idea</text>
    <rect x="174" y="604" width="146" height="44" rx="7" fill="#35373A"/>
    <text x="247" y="632" text-anchor="middle" font-size="16">Hide evidence</text>
  </g>
</svg>
