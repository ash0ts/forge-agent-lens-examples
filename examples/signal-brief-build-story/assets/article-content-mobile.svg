<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 600" role="img" aria-labelledby="title desc">
  <title id="title">Readable detail from the installed Signal Brief Content view</title>
  <desc id="desc">A reflowed detail shows a content proposal linked to its source story, its why-now assessment, and separate approval and evidence-review actions.</desc>
  <rect width="390" height="600" fill="#171A1F"/>
  <g font-family="Source Sans 3, Arial, sans-serif" fill="#FDFDFD">
    <rect x="18" y="18" width="354" height="54" rx="10" fill="#23262B" stroke="#626872"/>
    <text x="34" y="41" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="700" fill="#FCBC32">CONTENT · DECISION QUEUE</text>
    <text x="34" y="61" font-size="14" fill="#C9CDD3">A proposal—not an approved project</text>

    <rect x="18" y="88" width="354" height="494" rx="12" fill="#232323" stroke="#626872"/>
    <rect x="36" y="110" width="66" height="27" rx="13" fill="#5A341E"/>
    <text x="69" y="128" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" font-weight="700" fill="#FF9D3B">URGENT</text>
    <rect x="110" y="110" width="66" height="27" rx="13" fill="#37393D"/>
    <text x="143" y="128" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" font-weight="700" fill="#D6D9DE">REVIEW</text>

    <text x="36" y="171" font-size="22" font-weight="700">Predictive RL with W&amp;B Weave</text>
    <text x="36" y="205" font-size="16" fill="#D6D9DE">Making RL post-training transparent</text>
    <text x="36" y="228" font-size="16" fill="#D6D9DE">reduces wasted compute.</text>

    <text x="36" y="273" font-size="15" font-weight="600" fill="#5A96FF">↗ Connected to the news story you chose</text>

    <text x="36" y="318" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="700" fill="#C9CDD3">WHY NOW</text>
    <text x="36" y="350" font-size="17">The idea needs stronger or more varied</text>
    <text x="36" y="375" font-size="17">source evidence before a team pitch.</text>

    <rect x="36" y="422" width="126" height="44" rx="7" fill="#2F78FF"/>
    <text x="99" y="450" text-anchor="middle" font-size="16" font-weight="600">Approve idea</text>
    <rect x="174" y="422" width="150" height="44" rx="7" fill="#35373A"/>
    <text x="249" y="450" text-anchor="middle" font-size="16">Review evidence</text>

    <line x1="36" y1="500" x2="354" y2="500" stroke="#4B4E54"/>
    <text x="36" y="536" font-family="IBM Plex Mono, monospace" font-size="12" fill="#C9CDD3">THE NEXT STEP STAYS EXPLICIT</text>
    <text x="36" y="560" font-size="15" fill="#D6D9DE">No brief, handoff, or external action yet.</text>
  </g>
</svg>
