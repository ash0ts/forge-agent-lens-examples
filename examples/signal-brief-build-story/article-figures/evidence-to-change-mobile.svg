<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 790" role="img" aria-labelledby="title desc">
  <title id="title">The practitioner workflow from product invariant to verified change</title>
  <desc id="desc">The human states an invariant, Weave preserves the runtime artifact, Codex replays and repairs it, the installed app is checked, and the human chooses to ship, revise, or stop.</desc>
  <defs>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M16 0H0V16" fill="none" stroke="#E4E6EB"/></pattern>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#171A1F"/></marker>
  </defs>
  <rect width="390" height="790" fill="#FDFDFD"/><rect width="390" height="790" fill="url(#grid)"/>
  <g fill="#171A1F" font-family="Source Sans 3, Arial, sans-serif">
    <text x="20" y="40" font-family="Source Serif Pro, Georgia, serif" font-size="25">What I handed Codex</text>
    <text x="20" y="68" fill="#5B616B" font-size="14">A rule plus a reproducible failure.</text>

    <rect x="20" y="98" width="350" height="100" rx="8" fill="#FFD39C" stroke="#171A1F" stroke-width="2"/>
    <text x="38" y="126" font-family="IBM Plex Mono, monospace" font-size="13" font-weight="700">01 · HUMAN</text>
    <text x="38" y="155" font-size="21" font-weight="700">State the invariant.</text>
    <text x="38" y="180" font-size="14">Identity stays attached. Proposal ≠ approval.</text>
    <line x1="195" y1="198" x2="195" y2="222" stroke="#171A1F" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="20" y="236" width="350" height="100" rx="8" fill="#DCC8F3" stroke="#171A1F" stroke-width="2"/>
    <text x="38" y="264" font-family="IBM Plex Mono, monospace" font-size="13" font-weight="700">02 · WEAVE</text>
    <text x="38" y="293" font-size="21" font-weight="700">Preserve the failure.</text>
    <text x="38" y="318" font-size="14">Span · response · duration · model route</text>
    <line x1="195" y1="336" x2="195" y2="360" stroke="#171A1F" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="20" y="374" width="350" height="112" rx="8" fill="#10BFCC" stroke="#171A1F" stroke-width="2"/>
    <text x="38" y="402" font-family="IBM Plex Mono, monospace" font-size="13" font-weight="700">03 · CODEX</text>
    <text x="38" y="431" font-size="21" font-weight="700">Replay. Repair. Test.</text>
    <text x="38" y="456" font-size="14">Change the narrow boundary.</text>
    <text x="38" y="476" font-size="14">Do not buy another parser-debugging call.</text>
    <line x1="195" y1="486" x2="195" y2="510" stroke="#171A1F" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="20" y="524" width="350" height="112" rx="8" fill="#AFE0C7" stroke="#171A1F" stroke-width="2"/>
    <text x="38" y="552" font-family="IBM Plex Mono, monospace" font-size="13" font-weight="700">04 · INSTALLED APP</text>
    <text x="38" y="581" font-size="21" font-weight="700">Check the decision surface.</text>
    <text x="38" y="606" font-size="14">Can I see the evidence and take</text>
    <text x="38" y="626" font-size="14">the intended action?</text>
    <line x1="195" y1="636" x2="195" y2="660" stroke="#171A1F" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="72" y="674" width="246" height="64" rx="9" fill="#FCBC32" stroke="#171A1F" stroke-width="2"/>
    <text x="195" y="701" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="13" font-weight="700">05 · HUMAN</text>
    <text x="195" y="725" text-anchor="middle" font-size="20" font-weight="700">SHIP · REVISE · STOP</text>
    <text x="20" y="770" fill="#5B616B" font-size="13">Evidence informs the change. It does not approve it.</text>
  </g>
</svg>
